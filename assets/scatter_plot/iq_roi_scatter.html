    background: #fff; border: 1px solid #e4e4ec; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 16px;

  .ctrl-bar select {
    padding: 6px 10px; border-radius: 7px;
    border: 1px solid #d4d4e0; font-size: 13px; color: #333;
    background: #fafafa; cursor: pointer; min-width: 130px;
    transition: border-color .15s;
  }
  .ctrl-bar select:focus { outline: none; border-color: #7B68EE; box-shadow: 0 0 0 2px rgba(123,104,238,0.15); }

  .ctrl-divider { width: 1px; background: #e4e4ec; align-self: stretch; margin: 0 4px; }

  /* Slider section */
  .slider-wrap {
    background: #fff; border: 1px solid #e4e4ec; border-radius: 10px;
    padding: 14px 18px 10px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .slider-label { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .slider-label span { color: #7B68EE; font-size: 13px; font-weight: 700; }
  #iq-slider { width: 100%; accent-color: #7B68EE; cursor: pointer; }

  /* Chart */
  #chart { background: #fff; border: 1px solid #e4e4ec; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 12px; padding: 10px 16px;
    background: #fff; border: 1px solid #e4e4ec; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .stat-item { font-size: 12px; color: #666; }
  .stat-item strong { font-weight: 600; }
  .stat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

// ── Config ──────────────────────────────────────────────────────────────────
const GROUPS  = ["AVH+", "AVH-", "HC"];
const COLORS  = { "AVH+": "#7B68EE", "AVH-": "#2ECC71", "HC": "#F39C12" };
const SYMBOLS = { male: "diamond", female: "circle" };
const SEXES   = ["female", "male"];
const IQ_MIN  = 70, IQ_MAX = 116, IQ_STEP = 5;

// IQ slider snapped values
const iqTicks = [];
for (let v = IQ_MIN; v <= IQ_MAX; v += IQ_STEP) iqTicks.push(v);

// ── State ───────────────────────────────────────────────────────────────────
const state = { contrast: "Sentences", group: "all", sex: "all", cutoff: IQ_MAX };

// ── Helpers ──────────────────────────────────────────────────────────────────
function linreg(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for (let i=0;i<n;i++) { num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  if (den===0) return null;
  const slope=num/den, intercept=my-slope*mx;
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  return { x:[xMin,xMax], y:[slope*xMin+intercept, slope*xMax+intercept], slope, intercept, r2: (() => {
    const ss_res = ys.reduce((a,yi,i)=>a+(yi-(slope*xs[i]+intercept))**2,0);
    const ss_tot = ys.reduce((a,yi)=>a+(yi-my)**2,0);
    return ss_tot===0 ? 0 : 1-ss_res/ss_tot;
  })() };
}

function filtered() {
  return RAW[state.contrast].filter(d =>
    d.iq <= state.cutoff &&
    (state.group === "all" || d.group === state.group) &&
    (state.sex   === "all" || d.sex   === state.sex)
  );
}

// ── Build Plotly traces ───────────────────────────────────────────────────────
function buildTraces() {
  const data = filtered();
  const traces = [];

  for (const g of GROUPS) {
    const color = COLORS[g];
    const gData = data.filter(d => d.group === g);

    for (const s of SEXES) {
      const pts = gData.filter(d => d.sex === s);
      traces.push({
        x: pts.map(d=>d.iq),
        y: pts.map(d=>d.roi),
        mode: "markers",
        type: "scatter",
        name: `${g} · ${s}`,
        legendgroup: g,
        marker: {
          size: 11, color,
          symbol: SYMBOLS[s],
          opacity: 0.88,
          line: { width: 1.4, color: "rgba(255,255,255,0.85)" }
        },
        customdata: pts.map(d=>[d.id, d.age, d.sex, d.group, d.iq, d.roi]),
        hovertemplate:
          "<b>%{customdata[3]} · %{customdata[2]}</b><br>" +
          "ID: %{customdata[0]}<br>" +
          "Age: %{customdata[1]}<br>" +
          "IQ: %{customdata[4]}<br>" +
          "ROI Activation: %{customdata[5]:.2f}" +
          "<extra></extra>",
      });
    }

    // Regression line per group
    const reg = linreg(gData.map(d=>d.iq), gData.map(d=>d.roi));
    traces.push({
      x: reg ? reg.x : [],
      y: reg ? reg.y : [],
      mode: "lines",
      type: "scatter",
      name: `${g} fit`,
      legendgroup: g,
      showlegend: false,
      line: { color, width: 2.5, dash: "dot" },
      hoverinfo: "skip",
    });
  }
  return traces;
}

// ── Stats bar ──────────────────────────────────────────────────────────────
function updateStats() {
  const data = filtered();
  const bar = document.getElementById("stats-bar");
  let html = `<div class="stat-item"><strong>N = ${data.length}</strong></div>`;
  for (const g of GROUPS) {
    const gData = data.filter(d=>d.group===g);
    const reg = linreg(gData.map(d=>d.iq), gData.map(d=>d.roi));
    const r2str = reg ? `r²=${reg.r2.toFixed(2)}` : "n/a";
    html += `<div class="stat-item">
      <span class="stat-dot" style="background:${COLORS[g]}"></span>
      <strong>${g}</strong> n=${gData.length} · ${r2str}
    </div>`;
  }
  bar.innerHTML = html;
}

// ── Render / update ───────────────────────────────────────────────────────────
let initialized = false;

function render() {
  const traces = buildTraces();
  const allIQ  = filtered().map(d=>d.iq);
  const xMin   = allIQ.length ? Math.min(...allIQ) - 3 : IQ_MIN - 3;
  const xMax   = state.cutoff + 4;

  const layout = {
    template: "plotly_white",
    height: 500,
    paper_bgcolor: "#fff",
    plot_bgcolor: "#fff",
    font: { family: "Inter, Segoe UI, Helvetica Neue, Arial, sans-serif", size: 13, color: "#3a3a3a" },
    xaxis: {
      title: { text: "IQ", font: { size: 14, color: "#4a4a4a" } },
      range: [xMin, xMax],
      gridcolor: "rgba(200,200,200,0.3)", zeroline: false,
      tickfont: { size: 12, color: "#666" },
    },
    yaxis: {
      title: { text: "ROI Activation (COPE)", font: { size: 14, color: "#4a4a4a" } },
      gridcolor: "rgba(200,200,200,0.3)", zeroline: true,
      zerolinecolor: "rgba(150,150,150,0.4)", zerolinewidth: 1,
      tickfont: { size: 12, color: "#666" },
    },
    margin: { t: 20, r: 24, b: 60, l: 70 },
    legend: {
      font: { size: 12 }, orientation: "h",
      x: 0.5, y: -0.18, xanchor: "center", yanchor: "top",
      bgcolor: "rgba(255,255,255,0.9)",
      bordercolor: "rgba(200,200,200,0.5)", borderwidth: 1,
    },
    hoverlabel: {
      bgcolor: "white", bordercolor: "rgba(0,0,0,0.12)",
      font: { size: 12, color: "#333" },
    },
  };

  const config = { responsive: true, displayModeBar: false };

  if (!initialized) {
    Plotly.newPlot("chart", traces, layout, config);
    initialized = true;
  } else {
    Plotly.react("chart", traces, layout, config);
  }
  updateStats();
}

// ── Controls wiring ──────────────────────────────────────────────────────────
document.getElementById("sel-contrast").addEventListener("change", function() {
  state.contrast = this.value; render();
});
document.getElementById("sel-group").addEventListener("change", function() {
  state.group = this.value; render();
});
document.getElementById("sel-sex").addEventListener("change", function() {
  state.sex = this.value; render();
});

const iqSlider = document.getElementById("iq-slider");
const iqVal    = document.getElementById("iq-val");

iqSlider.addEventListener("input", function() {
  // Snap to nearest tick
  const raw = parseInt(this.value, 10);
  const snapped = iqTicks.reduce((a,b) => Math.abs(b-raw)<Math.abs(a-raw)?b:a);
  state.cutoff = snapped;
  iqVal.textContent = snapped;
  render();
});

// ── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
