<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Interactive Pairwise Plot</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<style>
  :root {
    --border:#e5e7eb;
    --muted:#475569;
    --text:#0f172a;
    --panel:#fbfbfd;
    --bg:#ffffff;
    --shadow: 0 10px 25px rgba(15,23,42,.06);
  }

  body {
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color: var(--text);
    background: var(--bg);
  }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 16px 28px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0 0 14px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* --- layout --- */
  .grid {
    display:grid;
    grid-template-columns: 380px 1fr;
    gap: 16px;
    align-items:start;
  }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* --- control panel --- */
  .controls {
    border:1px solid var(--border);
    background: var(--panel);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .block {
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .block:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .sectionTitle {
    font-size: 12px;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }

  /* --- checkbox rows --- */
  .row {
    display:flex;
    gap: 12px 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  label {
    display:inline-flex;
    gap: 10px;
    align-items:center;
    font-size: 16px;
    user-select:none;
    padding: 6px 8px;
    border-radius: 10px;
  }

  label:hover {
    background: rgba(15,23,42,.03);
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    transform: translateY(1px);
    accent-color: #2563eb;
  }

  /* --- range grid --- */
  .two {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 980px) {
    .two { grid-template-columns: 1fr; }
  }

  /* --- range boxes (scaled down) --- */
  .rangeBox {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 16px;  /* ↓ */
    padding: 12px;        /* ↓ */
    overflow: hidden;
  }

  .rangeBox .name {
    font-size: 14px;      /* ↓ */
    font-weight: 600;     /* ↓ */
    color: #334155;
    margin: 0 0 8px;      /* ↓ */
  }

  .rangeBox .inputs {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;             /* ↓ */
  }

  .rangeBox input[type="number"] {
    min-width: 0;
    width: 100%;
    box-sizing: border-box;

    padding: 10px 12px;   /* ↓ */
    border-radius: 14px;  /* ↓ */
    border: 1px solid var(--border);
    background: #fff;

    font-size: 20px;      /* ↓ */
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;

    outline: none;
  }

  .rangeBox input[type="number"]:focus {
    border-color: #93c5fd;
    box-shadow: 0 0 0 4px rgba(59,130,246,.15);
  }

  .rangeBox input[type="number"]::-webkit-outer-spin-button,
  .rangeBox input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* --- buttons --- */
  .btnRow {
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 16px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 6px 16px rgba(15,23,42,.05);
  }

  button:hover {
    opacity: .95;
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0px);
  }

  /* auto-update enabled */
  #update {
    display: none;
  }

  /* --- plot panel --- */
  #plot {
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow:hidden;
    background:#fff;
    min-height: 620px;
    position: relative;
  }

  .note {
    font-size: 14px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Interactive Pairwise Plot (Choose variables + filter participants)</h1>
    <p class="subtitle">
      Filter by group and by numeric ranges (age/IQ/PSYRATS/ROI)</strong>.
    </p>

    <div class="grid">
      <div class="controls">
        <div class="block">
          <div class="sectionTitle">Variables (what to plot)</div>
          <div id="varChecklist" class="row"></div>
          <div class="note">Pick at least 2.</div>
        </div>

        <div class="block">
          <div class="sectionTitle">Filters (which rows to include)</div>

          <div style="margin-bottom:12px;">
            <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">Group</div>
            <div id="groupChecklist" class="row"></div>
          </div>

          <div class="two" id="rangeGrid"></div>

          <div class="btnRow">
            <button id="selectAllVars">Select all vars</button>
            <button id="clearVars">Clear vars</button>
            <button id="resetFilters">Reset filters</button>
            <button id="update">Update</button>
          </div>

          <div class="note">
            If the plot looks empty, your filters might be too strict.
          </div>
        </div>
      </div>

      <div id="plot"></div>
    </div>
  </div>

  function makeCheckbox(container, value, checked=true) {
    const id = container.id + "_" + value.replace(/[^a-z0-9]/gi, "_");
    const label = document.createElement("label");
    label.setAttribute("for", id);

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = id;
    cb.value = value;
    cb.checked = checked;

    const span = document.createElement("span");
    span.textContent = value;

    label.appendChild(cb);
    label.appendChild(span);
    container.appendChild(label);
  }

  function checkedValues(container) {
    return Array.from(container.querySelectorAll("input[type=checkbox]"))
      .filter(cb => cb.checked)
      .map(cb => cb.value);
  }

  const varChecklist = document.getElementById("varChecklist");
  const groupChecklist = document.getElementById("groupChecklist");
  const rangeGrid = document.getElementById("rangeGrid");

  // defaults
  NUM_COLS.forEach(v => makeCheckbox(varChecklist, v, true));
  GROUPS.forEach(g => makeCheckbox(groupChecklist, g, true));

  function buildRangeBox(col) {
    const box = document.createElement("div");
    box.className = "rangeBox";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = col;

    const inputs = document.createElement("div");
    inputs.className = "inputs";

    const minInput = document.createElement("input");
    minInput.type = "number";
    minInput.step = "any";
    minInput.value = MINS[col];
    minInput.id = "min_" + col.replace(/[^a-z0-9]/gi, "_");

    const maxInput = document.createElement("input");
    maxInput.type = "number";
    maxInput.step = "any";
    maxInput.value = MAXS[col];
    maxInput.id = "max_" + col.replace(/[^a-z0-9]/gi, "_");

    inputs.appendChild(minInput);
    inputs.appendChild(maxInput);

    box.appendChild(name);
    box.appendChild(inputs);
    return box;
  }

  NUM_COLS.forEach(col => rangeGrid.appendChild(buildRangeBox(col)));

  function getRanges() {
    const ranges = {};
    NUM_COLS.forEach(col => {
      const key = col.replace(/[^a-z0-9]/gi, "_");
      const minVal = parseFloat(document.getElementById("min_" + key).value);
      const maxVal = parseFloat(document.getElementById("max_" + key).value);
      ranges[col] = [minVal, maxVal];
    });
    return ranges;
  }

  function filterRows() {
    const selectedGroups = new Set(checkedValues(groupChecklist));
    const ranges = getRanges();

    return ROWS.filter(r => {
      if (!selectedGroups.has(r.group)) return false;

      for (const col of NUM_COLS) {
        const v = r[col];
        const [mn, mx] = ranges[col];
        if (!(v >= mn && v <= mx)) return false;
      }
      return true;
    });
  }

  function buildSplom(rows, selectedVars) {
    const plotDiv = document.getElementById("plot");

    if (selectedVars.length < 2) {
      Plotly.purge(plotDiv);
      plotDiv.innerHTML = "<div style='padding:18px;color:#475569'>Select at least 2 variables.</div>";
      return;
    }
    if (rows.length === 0) {
      Plotly.purge(plotDiv);
      plotDiv.innerHTML = "<div style='padding:18px;color:#475569'>No rows match the current filters.</div>";
      return;
    }

    const groupsInData = ["HC","AVH+","AVH-"].filter(g => rows.some(r => r.group === g));
    const groupColor = groupsInData.map(g => PALETTE[g] || "#999999");

    const groupToNum = new Map(groupsInData.map((g, i) => [g, i]));
    const groupNums = rows.map(r => groupToNum.get(r.group));

    const colorscale = groupsInData.map((g, i) => {
      const pos = (groupsInData.length === 1) ? 0 : i / (groupsInData.length - 1);
      return [pos, groupColor[i]];
    });

    const dimensions = selectedVars.map(v => ({
      label: v,
      values: rows.map(r => r[v])
    }));

    const customdata = rows.map(r => ([
      r.participant_id,
      r.sex,
      r.group
    ]));

    const trace = {
      type: "splom",
      dimensions: dimensions,
      customdata: customdata,
      marker: {
        color: groupNums,
        colorscale: colorscale,
        showscale: false,
        size: 6,
        opacity: 0.75,
        line: { width: 0.5, color: "white" }
      },
      diagonal: { visible: false },
      hovertemplate:
        "<b>%{customdata[2]}</b><br>" +
        "ID: %{customdata[0]}<br>" +
        "Sex: %{customdata[1]}<br>" +
        "%{xaxis.title.text}: %{x}<br>" +
        "%{yaxis.title.text}: %{y}<br>" +
        "<extra></extra>"
    };

    // --- Add diagonal distributions (histograms) by group ---
    const extraTraces = [];
    const groupsForDiag = ["HC","AVH+","AVH-"].filter(g => rows.some(r => r.group === g));

    selectedVars.forEach((v, i) => {
      groupsForDiag.forEach(g => {
        const vals = rows
          .filter(r => r.group === g)
          .map(r => r[v])
          .filter(x => Number.isFinite(x));

        extraTraces.push({
          type: "histogram",
          x: vals,
          xaxis: "x" + (i + 1),
          yaxis: "y" + (i + 1),
          name: g,
          marker: { color: (PALETTE[g] || "#999999") },
          opacity: 0.25,
          showlegend: false,
          hovertemplate:
            "<b>" + g + "</b><br>" +
            v + ": %{x}<br>" +
            "Count: %{y}<extra></extra>"
        });
      });
    });

    const layout = {
      margin: { l: 70, r: 20, t: 20, b: 70 },
      height: Math.max(620, 140 * selectedVars.length),
      dragmode: "select",
      hovermode: "closest",
      barmode: "overlay",
      font: {
        family: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
        size: 12
      }
    };

    const config = { responsive: true };

    Plotly.react(plotDiv, [trace, ...extraTraces], layout, config);

    // Overlay legend
    const old = document.getElementById("customLegend");
    if (old) old.remove();

    const legend = document.createElement("div");
    legend.id = "customLegend";
    legend.style.position = "absolute";
    legend.style.right = "14px";
    legend.style.top = "14px";
    legend.style.background = "rgba(255,255,255,0.92)";
    legend.style.border = "1px solid #e5e7eb";
    legend.style.borderRadius = "12px";
    legend.style.padding = "10px 12px";
    legend.style.fontSize = "12px";
    legend.style.color = "#0f172a";
    legend.style.display = "grid";
    legend.style.gap = "6px";
    legend.style.pointerEvents = "none";

    const title = document.createElement("div");
    title.textContent = "Group";
    title.style.fontWeight = "600";
    title.style.marginBottom = "4px";
    legend.appendChild(title);

    groupsInData.forEach((g, i) => {
      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.gap = "8px";
      row.style.alignItems = "center";

      const dot = document.createElement("span");
      dot.style.width = "10px";
      dot.style.height = "10px";
      dot.style.borderRadius = "999px";
      dot.style.background = groupColor[i];
      dot.style.display = "inline-block";

      const txt = document.createElement("span");
      txt.textContent = g;

      row.appendChild(dot);
      row.appendChild(txt);
      legend.appendChild(row);
    });

    plotDiv.appendChild(legend);
  }

  function updatePlot() {
    const selectedVars = checkedValues(varChecklist);
    const filtered = filterRows();
    buildSplom(filtered, selectedVars);
  }

  // Buttons (now call updatePlot at end)
  document.getElementById("selectAllVars").addEventListener("click", () => {
    varChecklist.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
    updatePlot();
  });

  document.getElementById("clearVars").addEventListener("click", () => {
    varChecklist.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
    updatePlot();
  });

  document.getElementById("resetFilters").addEventListener("click", () => {
    groupChecklist.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
    NUM_COLS.forEach(col => {
      const key = col.replace(/[^a-z0-9]/gi, "_");
      document.getElementById("min_" + key).value = MINS[col];
      document.getElementById("max_" + key).value = MAXS[col];
    });
    updatePlot();
  });

  // -------- Auto-update (no need to click Update) --------
  function debounce(fn, wait = 150) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  const updatePlotDebounced = debounce(updatePlot, 150);

  document
    .querySelectorAll("#varChecklist input[type=checkbox], #groupChecklist input[type=checkbox]")
    .forEach(el => el.addEventListener("change", updatePlotDebounced));

  document
    .querySelectorAll("#rangeGrid input[type=number]")
    .forEach(el => el.addEventListener("input", updatePlotDebounced));

  // initial render
  updatePlot();
</script>
</body>
</html>
